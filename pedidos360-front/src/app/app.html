<main class="container">
  <h1>Pedidos 360</h1>
  <p>
    Frontend Cloud Native
  </p>
  <hr>
  <button (click) = "login()">
    Iniciar sesión
  </button>

  <button (click) = "verSesion()">
    Ver Sesión
  </button>

  <button (click) = "logout()">
    Cerrar Sesión
  </button>

  @if(autenticado){
    <section>
      <h2>Usuario autenticado</h2>
      <p>{{usuario}}</p>

      <h3>Access token</h3>
      <textarea rows="10" cols="80" readonly>{{token}}</textarea>
      
    </section>
  }
</main>
